name: RiskPoint browser E2E
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # Playwright and axe-core are locked in package-lock.json; no ad-hoc installs.
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Builds dist/ (web + standalone) and runs the preview, standalone and
      # read-only frozen Build 1 projects. No deployment or artifact changes.
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
